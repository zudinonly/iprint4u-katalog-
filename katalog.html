<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Design | iPrint4U</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    .dark-mode {
      --bg: #0f172a;
      --card: #1e2937;
      --text: #e2e8f0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: all 0.3s;
    }

    /* Navbar Sticky */
    .navbar-custom {
      background: white;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
      padding: 10px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-custom .nav-link {
      color: #334155;
      font-weight: 500;
      margin: 0 6px;
      font-size: 0.95rem;
    }
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link.active {
      color: #1e40af;
    }
    .navbar-logo { max-height: 40px; }

    /* Header Katalog */
    .header-katalog {
      background: linear-gradient(rgba(15,23,42,0.55), rgba(15,23,42,0.55)), url('header-bg.jpg');
      background-size: cover;
      background-position: center;
      padding: 45px 20px 40px;
      text-align: center;
      color: white;
      position: relative;
    }
    .header-katalog .logo {
      max-height: 70px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    .dark-toggle {
      position: absolute;
      top: 15px;
      right: 20px;
    }

    .product-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      transition: all 0.25s;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.12);
    }
    .product-img {
      width: 100%;
      height: 195px;
      object-fit: cover;
    }
    .item-number {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 2;
    }
    .share-btn {
      position: absolute;
      top: 10px; left: 10px;
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
    }
    .share-btn:hover { background: #3b82f6; }
    .category-btn {
      border-radius: 30px;
      padding: 7px 18px;
      margin: 4px;
      font-size: 0.9rem;
    }
    .category-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .wa-float {
      position: fixed;
      bottom: 25px; right: 25px;
      width: 58px; height: 58px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 6px 20px rgba(37,211,102,0.4);
      z-index: 999;
      text-decoration: none;
    }
    .back-to-top {
      position: fixed;
      bottom: 95px; right: 25px;
      width: 42px; height: 42px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 998;
      cursor: pointer;
    }
    .back-to-top.show { display: flex; }
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 45px; height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

  <!-- Navbar Sticky -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="logo.png" alt="iPrint4U" class="navbar-logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="katalog.html">Katalog Design</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#servis">Servis</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#hubungi">Hubungi Kami</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header (header-bg + logo) -->
  <div class="header-katalog">
    <button id="darkModeToggle" class="btn btn-light btn-sm dark-toggle">
      <i class="fas fa-moon"></i>
    </button>
    <img src="logo.png" alt="iPrint4U" class="logo">
  </div>

  <div class="container py-4">
    <div class="row justify-content-center mb-3 g-2">
      <div class="col-8 col-md-5">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search" inputmode="numeric">
      </div>
      <div class="col-4 col-md-2">
        <button id="searchBtn" class="btn btn-primary btn-lg w-100"><i class="fas fa-search"></i></button>
      </div>
      <div class="col-12 col-md-3">
        <select id="itemsPerPage" class="form-select form-select-lg">
          <option value="16">16 per page</option>
          <option value="24" selected>24 per page</option>
          <option value="32">32 per page</option>
          <option value="48">48 per page</option>
        </select>
      </div>
    </div>

    <div class="text-center mb-4">
      <button class="btn btn-outline-primary category-btn active" data-category="Semua">Semua</button>
      <button class="btn btn-outline-primary category-btn" data-category="Jersey">Jersey</button>
    </div>

    <div class="row g-3" id="productGrid"></div>

    <nav class="mt-4">
      <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
  </div>

  <!-- Footer -->
  <footer style="background:#f8fafc; border-top:1px solid #e2e8f0; padding:22px 0; margin-top:50px; font-size:0.85rem; color:#64748b;">
    <div class="container">
      <div class="text-center mb-3">
        <a href="index.html" class="btn btn-outline-primary btn-sm px-4" style="border-radius:30px;">← Kembali ke Laman Utama</a>
      </div>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div class="text-center text-md-start">
          © 2026 All rights reserved • iPrint4U • Made with ❤️ in Shah Alam
        </div>
        <div class="text-center text-md-end">
          <a href="#" style="color:#64748b; text-decoration:none; margin:0 8px;">Privacy Policy</a>
          <a href="#" style="color:#64748b; text-decoration:none; margin:0 8px;">Terms of Service</a>
          <a href="#" style="color:#64748b; text-decoration:none; margin:0 8px;">Delivery Info</a>
          <a href="#" style="color:#64748b; text-decoration:none; margin:0 8px;">Return Policy</a>
        </div>
      </div>
    </div>
  </footer>

  <a href="https://wa.me/60133867722" class="wa-float" target="_blank"><i class="fab fa-whatsapp"></i></a>
  <button class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></button>

  <!-- Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalImage" class="modal-img" alt="">
          <div class="mt-3 d-flex justify-content-center gap-2 flex-wrap">
            <button class="btn btn-success" id="orderWhatsAppBtn"><i class="fab fa-whatsapp"></i> Order via WhatsApp</button>
            <button class="btn btn-outline-primary" id="modalShareBtn"><i class="fas fa-share-alt"></i> Share</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentPage = 1, itemsPerPage = 24, currentCategory = "Semua", isDarkMode = false, currentProduct = null;

    const jerseyProducts = [];
    for (let i = 1; i <= 400; i++) {
      jerseyProducts.push({ id: "D"+i, name: "D"+i, category: "Jersey", image: `images/D${i}.jpg` });
    }
    const allProducts = [...jerseyProducts];

    function getFiltered() {
      return currentCategory === "Semua" ? allProducts : allProducts.filter(p => p.category === currentCategory);
    }

    function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

    document.getElementById('darkModeToggle').onclick = () => {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('dark-mode', isDarkMode);
      document.getElementById('darkModeToggle').innerHTML = isDarkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    };

    const backToTop = document.getElementById('backToTop');
    window.onscroll = () => backToTop.classList.toggle('show', window.scrollY > 400);
    backToTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.dataset.category;
        currentPage = 1;
        generateProducts();
        renderPagination();
      };
    });

    function generateProducts() {
      showLoading();
      setTimeout(() => {
        const products = getFiltered();
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        const start = (currentPage-1)*itemsPerPage;
        const pageItems = products.slice(start, start+itemsPerPage);

        pageItems.forEach(p => {
          grid.innerHTML += `
            <div class="col-6 col-md-4 col-lg-3 col-xl-2">
              <div class="product-card">
                <button class="share-btn" onclick="shareProduct('${p.id}');event.stopPropagation()">
                  <i class="fas fa-share-alt"></i>
                </button>
                <div onclick="showImage('${p.id}','${p.image}')" style="cursor:pointer">
                  <span class="item-number">${p.id}</span>
                  <img src="${p.image}" onerror="this.src='${p.image.replace('.jpg','.png')}';this.onerror=null"
                       class="product-img" alt="${p.id}" loading="lazy">
                  <div class="text-center py-2"><strong style="font-size:0.9rem">${p.id}</strong></div>
                </div>
              </div>
            </div>`;
        });
        hideLoading();
      }, 200);
    }

    function showImage(id, image) {
      currentProduct = id;
      document.getElementById('modalTitle').textContent = id + ' - iPrint4U';
      const img = document.getElementById('modalImage');
      img.src = image;
      img.onerror = () => img.src = image.replace('.jpg','.png');
      new bootstrap.Modal(document.getElementById('imageModal')).show();
    }

    function shareProduct(id) {
      if (!id) id = currentProduct;
      const url = location.origin + location.pathname + '?item=' + id;
      if (navigator.share) navigator.share({ title: id+' - iPrint4U', url }).catch(()=>{});
      else navigator.clipboard.writeText(url).then(() => alert('Link disalin!\n'+url));
    }

    document.getElementById('orderWhatsAppBtn').onclick = () => {
      const msg = encodeURIComponent(`saya berminat dengan produk ${currentProduct} dari katalog iPrint4U.\nBoleh saya tahu: 1. Harga untuk produk ini 2. Jenis bahan 3. Cara order\nTerima kasih.`);
      window.open(`https://wa.me/60133867722?text=${msg}`, '_blank');
    };
    document.getElementById('modalShareBtn').onclick = () => shareProduct(currentProduct);

    function doSearch() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim().replace(/d/i,'');
      const num = parseInt(term);
      if (num >= 1 && num <= 400) {
        showImage('D'+num, `images/D${num}.jpg`);
        document.getElementById('searchInput').value = 'D'+num;
      }
    }
    document.getElementById('searchBtn').onclick = doSearch;
    document.getElementById('searchInput').onkeypress = e => { if (e.key==='Enter'){ e.preventDefault(); doSearch(); }};

    function renderPagination() {
      const total = Math.ceil(getFiltered().length / itemsPerPage);
      const pag = document.getElementById('pagination');
      pag.innerHTML = `<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPage-1});return false">Previous</a></li>`;
      let s = Math.max(1, currentPage-2), e = Math.min(total, s+4);
      for (let i=s; i<=e; i++) pag.innerHTML += `<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="#" onclick="changePage(${i});return false">${i}</a></li>`;
      pag.innerHTML += `<li class="page-item ${currentPage===total?'disabled':''}"><a class="page-link" href="#" onclick="changePage(${currentPage+1});return false">Next</a></li>`;
    }

    function changePage(p) {
      const total = Math.ceil(getFiltered().length / itemsPerPage);
      if (p<1 || p>total) return;
      currentPage = p;
      generateProducts();
      renderPagination();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    document.getElementById('itemsPerPage').onchange = function() {
      itemsPerPage = +this.value;
      currentPage = 1;
      generateProducts();
      renderPagination();
    };

    const item = new URLSearchParams(location.search).get('item');
    if (item) {
      const n = parseInt(item.replace(/d/i,''));
      if (n>=1 && n<=400) setTimeout(() => showImage('D'+n, `images/D${n}.jpg`), 400);
    }

    generateProducts();
    renderPagination();
  </script>
</body>
</html>
